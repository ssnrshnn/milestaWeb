<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The 1200×630 social card. scripts/make_og_images.mjs fills in the
     headline for each language and screenshots it. -->
<style>
  :root { --grad: linear-gradient(95deg, #ffc79c 0%, #f8927b 28%, #ec6a9b 58%, #b172f5 100%); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #07060a; }
  body { position: relative; color: #f6f3f8; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; border-radius: 50%; }
  .g1 { width: 900px; height: 900px; right: -260px; top: -380px; background: radial-gradient(closest-side, rgb(66 173 153 / .55), rgb(61 92 168 / .35) 46%, rgb(26 28 71 / .15) 66%, transparent); }
  .g2 { width: 760px; height: 760px; left: -300px; top: 160px; background: radial-gradient(closest-side, rgb(247 150 110 / .38), rgb(219 92 107 / .22) 50%, transparent); }
  .g3 { width: 800px; height: 800px; left: 360px; top: 250px; background: radial-gradient(closest-side, rgb(237 82 140 / .32), rgb(140 56 189 / .26) 50%, transparent); }
  .copy { position: absolute; left: 72px; top: 64px; width: 620px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 0 0 1px rgb(255 255 255 / .12), 0 10px 30px -8px rgb(245 158 89 / .7); }
  .brand span { font-family: ui-serif, "New York", Georgia, serif; font-weight: 700; font-size: 34px; }
  h1 { margin-top: 56px; font-size: 76px; font-weight: 800; letter-spacing: -.045em; line-height: .98; }
  h1 .line { display: block; }
  h1 .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 .serif-accent { font-family: ui-serif, "New York", Georgia, serif; font-style: italic; font-weight: 500; letter-spacing: -.02em; }
  .sub { margin-top: 30px; font-size: 26px; font-weight: 600; color: rgb(246 243 248 / .72); }
  .posters { position: absolute; right: 40px; top: 70px; width: 470px; height: 560px; }
  .posters img { position: absolute; width: 250px; border-radius: 16px; box-shadow: 0 40px 70px -24px rgb(0 0 0 / .95), 0 0 0 1px rgb(255 255 255 / .12); }
  .p1 { left: 10px; top: 30px; transform: rotate(-6deg); z-index: 2; }
  .p2 { right: 0; top: 0; transform: rotate(5deg); }
  /* scripts without Latin tracking or italics */
  :is(:lang(ar), :lang(ur), :lang(hi), :lang(bn), :lang(ja), :lang(zh)) * { letter-spacing: normal !important; }
  :is(:lang(ar), :lang(ur), :lang(hi), :lang(bn), :lang(ja), :lang(zh)) h1 .serif-accent { font-family: inherit; font-style: normal; font-weight: inherit; }
  :is(:lang(ar), :lang(hi), :lang(bn)) h1 { line-height: 1.3; }
  :lang(ur) h1 { line-height: 1.7; }
  [dir="rtl"] .copy { left: auto; right: 72px; }
  [dir="rtl"] .posters { right: auto; left: 40px; }
</style>
</head>
<body>
  <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
  <div class="copy">
    <div class="brand"><img src="../assets/icon-256.webp" alt=""><span>Milesta</span></div>
    <h1 id="headline"><span class="line">Your life,</span> <span class="line grad-text">one milestone</span> <span class="line serif-accent">at a time.</span></h1>
    <p class="sub" id="sub">For iPhone &amp; iPad</p>
  </div>
  <div class="posters">
    <img class="p2" src="../assets/wrapped/poster-yearB-2025-aurora.webp" alt="">
    <img class="p1" src="../assets/wrapped/poster-yearA-2025-aurora.webp" alt="">
  </div>
</body>
</html>
